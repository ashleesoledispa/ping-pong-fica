<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Torneo de Ping Pong</title>
  <meta name="theme-color" content="#0a2552">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page-admin">

  <!-- LOGIN -->
  <section class="login" data-login hidden>
    <div class="banderines" aria-hidden="true"></div>
    <form class="login__card" data-login-form>
      <span class="ball-css ball-css--bounce" aria-hidden="true"></span>
      <h1>Panel secreto</h1>
      <p>Torneo de Ping Pong · ASE UDLA FICA</p>
      <div class="field">
        <label for="usuario">Usuario</label>
        <input id="usuario" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" data-login-error role="alert" hidden></p>
      <button class="btn btn--red btn--block btn--lg" type="submit">Entrar</button>
      <a href="/" class="login__back">← Volver a la página</a>
    </form>
  </section>

  <!-- PANEL -->
  <div class="panel" data-panel hidden>
    <header class="panel__bar">
      <div class="panel__brand">
        <span class="logo-slot logo-slot--sm" data-label="ASE">
          <img src="/assets/logos/logo-ase-udla.png" alt="ASE UDLA">
        </span>
        <div>
          <b>Inscripciones</b>
          <small data-status>Cargando…</small>
        </div>
      </div>
      <div class="panel__actions">
        <button class="btn btn--ghost btn--sm" data-refresh>↻ Actualizar</button>
        <a class="btn btn--white btn--sm" href="/api/admin/export.csv">⬇ Excel (CSV)</a>
        <button class="btn btn--red btn--sm" data-logout>Salir</button>
      </div>
    </header>

    <main class="panel__main">
      <section class="stats">
        <div class="stat-card"><span>Inscritos activos</span><b data-stat="total">0</b></div>
        <div class="stat-card stat-card--warn"><span>Pendientes</span><b data-stat="pendiente">0</b></div>
        <div class="stat-card stat-card--ok"><span>Confirmadas</span><b data-stat="confirmada">0</b></div>
        <div class="stat-card stat-card--bad"><span>Rechazadas</span><b data-stat="rechazada">0</b></div>
        <div class="stat-card stat-card--money"><span>Recaudado (confirmadas)</span><b data-stat="dinero">$0</b></div>
      </section>

      <section class="toolbar">
        <div class="filters" role="tablist">
          <button class="filter is-active" data-filter="todas">Todas</button>
          <button class="filter" data-filter="pendiente">Pendientes</button>
          <button class="filter" data-filter="confirmada">Confirmadas</button>
          <button class="filter" data-filter="rechazada">Rechazadas</button>
        </div>
        <input class="search" type="search" placeholder="Buscar por nombre, correo, ID Banner, celular, código…" data-search>
      </section>

      <section class="list" data-list></section>
      <p class="empty" data-empty hidden>No hay inscripciones que mostrar todavía.</p>
    </main>
  </div>

  <!-- VISOR DE COMPROBANTES -->
  <div class="modal" data-modal hidden>
    <div class="modal__box">
      <button class="modal__close" data-modal-close aria-label="Cerrar">✕</button>
      <div class="modal__content" data-modal-content></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
